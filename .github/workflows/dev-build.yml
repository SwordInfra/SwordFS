name: Dev Build

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: CMake build type
        required: true
        default: Debug
        type: choice
        options:
          - Debug
          - Release
      target:
        description: CMake target to build
        required: true
        default: swordfs_test
        type: choice
        options:
          - swordfs
          - swordfs_test
          - swordfs_e2e_test
      run_unit_tests:
        description: Run swordfs_test after building it
        required: true
        default: false
        type: boolean
      gtest_filter:
        description: Optional GTest filter when run_unit_tests is enabled
        required: false
        default: ""
        type: string
      run_e2e_tests:
        description: Run bounded service-backed E2E repetitions (Release/swordfs_e2e_test only)
        required: false
        default: false
        type: boolean
      checkout_ref:
        description: Optional exact source commit SHA for E2E diagnosis
        required: false
        default: ""
        type: string
      e2e_repetitions:
        description: Number of isolated E2E invocations, 1-20
        required: false
        default: "1"
        type: string

concurrency:
  group: dev-build-${{ github.ref }}-${{ inputs.checkout_ref || github.sha }}-${{ inputs.build_type }}-${{ inputs.target }}
  cancel-in-progress: true

jobs:
  dev-build:
    name: dev-build (${{ inputs.build_type }}, ${{ inputs.target }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read

    steps:
      - name: Validate inputs
        if: ${{ (inputs.run_unit_tests && inputs.target != 'swordfs_test') || (inputs.run_e2e_tests && (inputs.target != 'swordfs_e2e_test' || inputs.build_type != 'Release' || inputs.gtest_filter == '')) }}
        run: |
          echo "Invalid focused test target/build/filter combination"
          exit 1

      - name: Validate bounded E2E inputs
        if: ${{ inputs.run_e2e_tests }}
        env:
          TARGET_COMMIT: ${{ inputs.checkout_ref }}
          REPETITIONS: ${{ inputs.e2e_repetitions }}
        run: |
          [[ "${REPETITIONS}" =~ ^[0-9]+$ ]] && (( REPETITIONS >= 1 && REPETITIONS <= 20 ))
          [[ -z "${TARGET_COMMIT}" || "${TARGET_COMMIT}" =~ ^[0-9a-f]{40}$ ]]

      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.checkout_ref || github.sha }}
          fetch-depth: 0
          submodules: false

      - name: Restore native dependency cache
        uses: actions/cache@v4
        with:
          path: .deps/install
          key: swordfs-native-deps-v4-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/build/native-deps-cache.env') }}

      - name: Install dependencies
        # Keep the same bounded APT behavior as required CI. A cold runner
        # previously stalled for >32 minutes in apt-get update.
        run: sudo SWORDFS_CI_APT_TIMEOUT_SECONDS=180 DEPS_PREFIX="${{ github.workspace }}/.deps/install" bash scripts/build/install-deps.sh

      - name: Restore pinned MinIO tools cache
        if: ${{ inputs.run_e2e_tests }}
        uses: actions/cache@v4
        with:
          path: .deps/minio
          key: swordfs-minio-tools-v1-${{ runner.os }}-${{ runner.arch }}-2025-09-07-2025-08-13

      - name: Setup focused E2E services and FUSE
        if: ${{ inputs.run_e2e_tests }}
        run: |
          source scripts/testing/minio-test.sh
          minio_test_ensure_tools
          sudo modprobe fuse
          sudo chmod 666 /dev/fuse
          getent group fuse || sudo groupadd fuse
          sudo usermod -aG fuse "$(whoami)"


      - name: Configure
        env:
          BUILD_TYPE: ${{ inputs.build_type }}
        run: |
          if [ "$BUILD_TYPE" = "Debug" ]; then
            cmake --preset default \
              -DCMAKE_PREFIX_PATH="${{ github.workspace }}/.deps/install"
          else
            if [ "${{ inputs.run_e2e_tests }}" = 'true' ]; then
              cmake --preset release \
                -DCMAKE_PREFIX_PATH="${{ github.workspace }}/.deps/install" \
                -DCMAKE_CXX_FLAGS="--coverage" \
                -DCMAKE_EXE_LINKER_FLAGS="--coverage"
            else
              cmake --preset release \
                -DCMAKE_PREFIX_PATH="${{ github.workspace }}/.deps/install"
            fi
          fi

      - name: Build requested target
        env:
          BUILD_TARGET: ${{ inputs.target }}
        run: |
          if [ "${{ inputs.run_e2e_tests }}" = 'true' ]; then
            cmake --build build --target swordfs swordfs_e2e_test
          else
            cmake --build build --target "$BUILD_TARGET"
          fi

      - name: Repeat focused E2E in fresh backend instances
        if: ${{ inputs.run_e2e_tests }}
        env:
          FOCUSED_FILTER: ${{ inputs.gtest_filter }}
          REPETITIONS: ${{ inputs.e2e_repetitions }}
        run: |
          set -euo pipefail
          echo "Source: $(git rev-parse HEAD); repetitions: ${REPETITIONS}; filter: ${FOCUSED_FILTER}"
          for ((i=1; i<=REPETITIONS; i++)); do
            echo "=== Focused E2E iteration ${i}/${REPETITIONS} ==="
            diag="${RUNNER_TEMP}/e2e-466/iteration-${i}"
            mkdir -p "${diag}"
            if ! sg fuse -c "SWORDFS_E2E_DIAGNOSTICS_DIR='${diag}' SWORDFS_ENABLE_COREDUMP=1 bash scripts/testing/run-e2e.sh --gtest_filter='${FOCUSED_FILTER}' --gtest_color=no"; then
              echo "FAILED at iteration ${i}/${REPETITIONS} SHA $(git rev-parse HEAD)" | tee "${RUNNER_TEMP}/e2e-466/failure.txt"
              exit 1
            fi
          done
          echo "PASS: ${REPETITIONS} isolated focused repetitions of $(git rev-parse HEAD)"

      - name: Capture focused E2E failure context
        if: ${{ failure() && inputs.run_e2e_tests }}
        run: |
          mkdir -p "${RUNNER_TEMP}/e2e-466/runner"
          sudo journalctl -k -n 300 --no-pager > "${RUNNER_TEMP}/e2e-466/runner/kernel.log" 2>&1 || true
          { cat /sys/fs/cgroup/memory.events; cat /proc/pressure/memory; } \
            > "${RUNNER_TEMP}/e2e-466/runner/memory.txt" 2>&1 || true

      - name: Upload focused E2E failure evidence
        if: ${{ failure() && inputs.run_e2e_tests }}
        uses: actions/upload-artifact@v4
        with:
          name: focused-e2e-failure-${{ inputs.checkout_ref || github.sha }}
          path: ${{ runner.temp }}/e2e-466
          retention-days: 7

      - name: Run focused unit tests
        if: ${{ inputs.run_unit_tests }}
        env:
          GTEST_FILTER: ${{ inputs.gtest_filter }}
        run: |
          args=(--gtest_color=no)
          if [ -n "$GTEST_FILTER" ]; then
            args+=("--gtest_filter=$GTEST_FILTER")
          fi
          bash scripts/testing/run-ut.sh "${args[@]}"
