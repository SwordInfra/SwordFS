name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  clang-format:
    name: clang-format
    if: github.event_name == 'pull_request' || github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.ref }}
          fetch-depth: 2

      - name: Install pre-commit
        run: pipx install pre-commit

      - name: Check formatting
        run: pre-commit run --all-files

  minio-test-tools:
    name: minio-test-tools
    needs: clang-format
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.ref }}
          fetch-depth: 1

      - name: Restore pinned MinIO tools cache
        uses: actions/cache@v4
        with:
          path: .deps/minio
          key: swordfs-minio-tools-v1-${{ runner.os }}-${{ runner.arch }}-2025-09-07-2025-08-13

      - name: Fetch and verify pinned MinIO tools
        run: |
          source scripts/testing/minio-test.sh
          minio_test_ensure_tools
          minio_test_print_versions

      - name: Upload pinned MinIO tools
        uses: actions/upload-artifact@v4
        with:
          name: minio-test-tools
          path: .deps/minio
          if-no-files-found: error
          retention-days: 1

  dead-code-audit:
    name: dead-code-audit
    needs: clang-format
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.ref }}
          fetch-depth: 0
          submodules: false

      - name: Restore native dependency cache
        uses: actions/cache@v4
        with:
          path: .deps/install
          key: swordfs-native-deps-v4-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/build/native-deps-cache.env') }}

      - name: Install dependencies
        run: sudo DEPS_PREFIX="${{ github.workspace }}/.deps/install" bash scripts/build/install-deps.sh

      - name: Install dead-code audit tools
        run: |
          sudo apt-get install -y -qq clang-tidy python3-clang

      - name: Configure
        run: |
          cmake --preset default \
            -DCMAKE_PREFIX_PATH="${{ github.workspace }}/.deps/install"

      - name: Configure semantic-audit fixture
        run: |
          cmake -S tests/static_analysis/fixture \
            -B build/static-audit-fixture \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug

      - name: Verify semantic-audit fixture
        env:
          PYTHONPATH: /usr/lib/python3/dist-packages
        run: |
          /usr/bin/python3 tests/static_analysis/test_symbol_audit.py \
            --build-dir build/static-audit-fixture

      - name: Run static audit
        env:
          PYTHONPATH: /usr/lib/python3/dist-packages
        run: |
          scripts/static-analysis/run.sh \
            --build-dir build \
            --output build/static-audit.json

      - name: Upload static-audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: static-audit-report
          path: build/static-audit.json
          if-no-files-found: warn

  build-and-test:
    name: build-and-test (${{ matrix.build_type }})
    needs: [clang-format, minio-test-tools]
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        build_type: [Debug, Release]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.ref }}
          fetch-depth: 0
          submodules: false

      - name: Download pinned MinIO tools
        if: matrix.build_type == 'Debug'
        uses: actions/download-artifact@v4
        with:
          name: minio-test-tools
          path: .deps/minio

      - name: Restore native dependency cache
        uses: actions/cache@v4
        with:
          path: .deps/install
          key: swordfs-native-deps-v4-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/build/native-deps-cache.env') }}

      - name: Install dependencies
        run: sudo DEPS_PREFIX="${{ github.workspace }}/.deps/install" bash scripts/build/install-deps.sh

      - name: Unit test setup
        run: |
          sudo mkdir -p /etc/swordfs
          sudo chown "$(id -u):$(id -g)" /etc/swordfs

      - name: Install Debug CI tools
        if: matrix.build_type == 'Debug'
        run: sudo apt-get install -y -qq lcov clang-tidy

      - name: Configure
        run: |
          sudo rm -rf build
          if [ "${{ matrix.build_type }}" = "Debug" ]; then
            cmake --preset default \
              -DCMAKE_PREFIX_PATH="${{ github.workspace }}/.deps/install" \
              -DCMAKE_CXX_FLAGS="--coverage" \
              -DCMAKE_EXE_LINKER_FLAGS="--coverage"
          else
            cmake --preset release \
              -DCMAKE_PREFIX_PATH="${{ github.workspace }}/.deps/install"
          fi

      - name: Build
        run: cmake --build build --target swordfs swordfs_test

      - name: Build focused Debug E2E coverage target
        if: matrix.build_type == 'Debug'
        run: cmake --build build --target swordfs_e2e_test

      - name: Run clang-tidy (changed files only)
        if: matrix.build_type == 'Debug'
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          else
            BASE=$(git rev-parse HEAD^ 2>/dev/null || git rev-list --max-parents=0 HEAD)
          fi
          echo "clang-tidy base: $BASE"
          CHANGED=$(git diff --name-only --diff-filter=ACMR "$BASE"...HEAD \
            | grep -E '\.(cpp|hpp)$' | grep '^src/' || true)
          if [ -n "$CHANGED" ]; then
            printf '%s\n' "$CHANGED"
            echo "$CHANGED" | xargs run-clang-tidy -p build -j $(nproc) \
              -warnings-as-errors='*'
          else
            echo "No C++ source changes detected."
          fi

      - name: Test (unit)
        run: |
          bash scripts/testing/run-ut.sh --gtest_color=no --gtest_output=xml:unit-test-results.xml
          if grep -q '<skipped' unit-test-results.xml; then
            echo "ERROR: unit test suite contains skipped tests."
            grep '<skipped' unit-test-results.xml
            exit 1
          fi

      - name: Run focused Debug service-backed coverage scenarios
        if: matrix.build_type == 'Debug'
        run: |
          bash scripts/testing/run-e2e.sh \
            --gtest_filter='S3DataEngineE2ETest.*:CommandCoverageE2ETest.*' \
            --gtest_color=no

      - name: Generate coverage report
        if: matrix.build_type == 'Debug'
        run: |
          set -euo pipefail

          # Step 1: capture raw coverage data
          lcov --capture --directory build --output-file coverage.info \
               --branch-coverage \
               --filter branch,exception,brace,blank,range \
               --ignore-errors inconsistent,gcov,source,mismatch,negative,empty,unused,corrupt,range
          if [ ! -s coverage.info ]; then
            echo "ERROR: lcov capture produced no coverage data"
            exit 1
          fi

          # Step 2: remove system / third-party paths
          lcov --remove coverage.info \
               '/usr/*' '*/_deps/*' '*/googletest-src/*' '*/build/*' \
               --output-file coverage_filtered.info \
               --branch-coverage \
               --filter branch,exception,brace,blank,range \
               --ignore-errors unused,empty,source,mismatch,corrupt,inconsistent,range
          if [ ! -s coverage_filtered.info ]; then
            echo "ERROR: filtering removed all coverage data"
            exit 1
          fi
          mv coverage_filtered.info coverage.info

          # Step 3: print summary
          lcov --list coverage.info --branch-coverage --ignore-errors unused,empty,source || true

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          else
            BASE=$(git rev-parse HEAD^ 2>/dev/null || git rev-list --max-parents=0 HEAD)
          fi
          python3 scripts/coverage/check-diff-coverage.py \
            --base "$BASE" \
            --tracefile coverage.info \
            --line-threshold 90

      - name: Upload coverage to Codecov
        if: matrix.build_type == 'Debug'
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.info
          disable_search: true
          plugins: noop
          fail_ci_if_error: false

  e2e-test:
    name: e2e-test (Release)
    needs: [clang-format, minio-test-tools]
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.ref }}
          fetch-depth: 2
          submodules: false

      - name: Download pinned MinIO tools
        uses: actions/download-artifact@v4
        with:
          name: minio-test-tools
          path: .deps/minio

      - name: Restore native dependency cache
        uses: actions/cache@v4
        with:
          path: .deps/install
          key: swordfs-native-deps-v4-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/build/native-deps-cache.env') }}

      - name: Install dependencies
        run: sudo DEPS_PREFIX="${{ github.workspace }}/.deps/install" bash scripts/build/install-deps.sh

      - name: E2E test setup
        run: |
          sudo apt-get install -y -qq lcov
          sudo mkdir -p /etc/swordfs
          sudo chown "$(id -u):$(id -g)" /etc/swordfs
          sudo modprobe fuse
          sudo chmod 666 /dev/fuse
          getent group fuse || sudo groupadd fuse
          sudo usermod -aG fuse "$(whoami)"

      - name: Configure Release
        run: |
          cmake --preset release \
            -DCMAKE_PREFIX_PATH="${{ github.workspace }}/.deps/install" \
            -DCMAKE_CXX_FLAGS="--coverage" \
            -DCMAKE_EXE_LINKER_FLAGS="--coverage"

      - name: Build E2E
        run: cmake --build build --target swordfs swordfs_e2e_test

      - name: Test (E2E)
        run: sg fuse -c "bash scripts/testing/run-e2e.sh --gtest_color=no"

      - name: Generate E2E coverage report
        run: |
          set -euo pipefail
          lcov --capture --directory build --output-file e2e-coverage.info \
               --branch-coverage \
               --filter branch,exception,brace,blank,range \
               --ignore-errors inconsistent,gcov,source,mismatch,negative,empty,unused,corrupt,range
          lcov --remove e2e-coverage.info \
               '/usr/*' '*/_deps/*' '*/googletest-src/*' '*/build/*' \
               --output-file e2e-coverage-filtered.info \
               --branch-coverage \
               --filter branch,exception,brace,blank,range \
               --ignore-errors unused,empty,source,mismatch,corrupt,inconsistent,range
          test -s e2e-coverage-filtered.info
          mv e2e-coverage-filtered.info e2e-coverage.info
          lcov --list e2e-coverage.info --branch-coverage --ignore-errors unused,empty,source || true

      - name: Upload E2E coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: e2e-coverage.info
          flags: e2e
          disable_search: true
          plugins: noop
          fail_ci_if_error: false

  pjdfstest-conformance:
    name: pjdfstest-conformance (Release)
    needs: [clang-format, minio-test-tools]
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.ref }}
          fetch-depth: 0
          submodules: false

      - name: Download pinned MinIO tools
        uses: actions/download-artifact@v4
        with:
          name: minio-test-tools
          path: .deps/minio

      - name: Restore native dependency cache
        uses: actions/cache@v4
        with:
          path: .deps/install
          key: swordfs-native-deps-v4-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/build/native-deps-cache.env') }}

      - name: Install dependencies
        run: sudo DEPS_PREFIX="${{ github.workspace }}/.deps/install" bash scripts/build/install-deps.sh

      - name: Install pjdfstest tools
        run: sudo apt-get install -y -qq autoconf automake perl

      - name: Conformance test setup
        run: |
          sudo mkdir -p /etc/swordfs
          sudo chown "$(id -u):$(id -g)" /etc/swordfs
          sudo modprobe fuse
          sudo chmod 666 /dev/fuse
          if ! grep -Eq '^[[:space:]]*user_allow_other([[:space:]]|$)' /etc/fuse.conf 2>/dev/null; then
            echo user_allow_other | sudo tee -a /etc/fuse.conf >/dev/null
          fi

      - name: Configure Release
        run: |
          cmake --preset release \
            -DCMAKE_PREFIX_PATH="${{ github.workspace }}/.deps/install"

      - name: Build SwordFS
        run: cmake --build build --target swordfs

      - name: Run pinned pjdfstest suite
        id: pjdfstest-harness
        run: |
          set +e
          sudo --preserve-env=GITHUB_RUN_ID,GITHUB_RUN_ATTEMPT,RUNNER_OS \
            SWORDFS_BIN="${{ github.workspace }}/build/swordfs" \
            bash scripts/conformance/pjdfstest/run.sh \
              --output-dir "${{ github.workspace }}/build/pjdfstest-conformance"
          status=$?
          set -e
          echo "${status}" | sudo tee build/pjdfstest-conformance/harness-status.txt >/dev/null
          sudo chown -R "$(id -u):$(id -g)" build/pjdfstest-conformance
          exit "${status}"

      - name: Classify conformance results
        if: always() && steps.pjdfstest-harness.outcome == 'success'
        env:
          ALLOW_SUPPORTED_REMOVAL: ${{ github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'conformance-semantic-change') }}
        run: |
          source conformance/pjdfstest/version.env
          baseline_args=()
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            previous_supported="${RUNNER_TEMP}/pjdfstest-previous-supported.txt"
            if git show "${{ github.event.pull_request.base.sha }}:conformance/pjdfstest/supported.txt" > "${previous_supported}" 2>/dev/null; then
              baseline_args+=(--previous-supported-file "${previous_supported}")
            fi
            if [ "${ALLOW_SUPPORTED_REMOVAL}" = "true" ]; then
              baseline_args+=(--allow-supported-removal)
            fi
          fi

          python3 scripts/conformance/pjdfstest/classify.py \
            --raw-dir build/pjdfstest-conformance/raw \
            --supported-file conformance/pjdfstest/supported.txt \
            --known-gaps-file conformance/pjdfstest/known-gaps.tsv \
            --output-dir build/pjdfstest-conformance \
            --swordfs-commit "${GITHUB_SHA}" \
            --pjdfstest-commit "${PJDFSTEST_COMMIT}" \
            --environment-json build/pjdfstest-conformance/environment.json \
            "${baseline_args[@]}" \
            --strict

      - name: Publish conformance summary to job
        if: always()
        run: |
          if [ -f build/pjdfstest-conformance/report.md ]; then
            cat build/pjdfstest-conformance/report.md >> "${GITHUB_STEP_SUMMARY}"
          else
            echo '## pjdfstest infrastructure failure' >> "${GITHUB_STEP_SUMMARY}"
            echo '' >> "${GITHUB_STEP_SUMMARY}"
            echo 'The harness ended before a classified report was produced. Inspect the uploaded logs.' >> "${GITHUB_STEP_SUMMARY}"
          fi

      - name: Upload pjdfstest evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pjdfstest-conformance
          path: build/pjdfstest-conformance
          if-no-files-found: warn

  fstests-conformance-shard:
    name: fstests-shard (${{ matrix.shard }})
    needs: [clang-format, minio-test-tools]
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.job_timeout }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: supported-0
            job_timeout: 90
            suite_timeout: 75m
          - shard: supported-1
            job_timeout: 90
            suite_timeout: 75m
          - shard: supported-2
            job_timeout: 90
            suite_timeout: 75m
          - shard: supported-3
            job_timeout: 90
            suite_timeout: 75m
          - shard: baseline-rest-0
            job_timeout: 90
            suite_timeout: 75m
          - shard: baseline-rest-1
            job_timeout: 90
            suite_timeout: 75m
          - shard: bounded-069
            job_timeout: 35
            suite_timeout: 15m
          - shard: bounded-471
            job_timeout: 35
            suite_timeout: 15m
          - shard: bounded-478
            job_timeout: 35
            suite_timeout: 15m
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.ref }}
          fetch-depth: 0
          submodules: false

      - name: Download pinned MinIO tools
        uses: actions/download-artifact@v4
        with:
          name: minio-test-tools
          path: .deps/minio

      - name: Restore native dependency cache
        uses: actions/cache@v4
        with:
          path: .deps/install
          key: swordfs-native-deps-v4-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/build/native-deps-cache.env') }}

      - name: Install dependencies
        run: sudo DEPS_PREFIX="${{ github.workspace }}/.deps/install" bash scripts/build/install-deps.sh

      - name: Install fstests tools
        run: |
          sudo apt-get install -y -qq \
            acct acl attr autoconf automake bc e2fsprogs fio fsverity gawk \
            libacl1-dev libaio-dev libcap-dev libtool libtool-bin \
            lvm2 psmisc quota sqlite3 uuid-dev uuid-runtime xfslibs-dev xfsprogs

      - name: Conformance test setup
        run: |
          sudo mkdir -p /etc/swordfs
          sudo chown "$(id -u):$(id -g)" /etc/swordfs
          sudo modprobe fuse
          sudo chmod 666 /dev/fuse
          if ! grep -Eq '^[[:space:]]*user_allow_other([[:space:]]|$)' /etc/fuse.conf 2>/dev/null; then
            echo user_allow_other | sudo tee -a /etc/fuse.conf >/dev/null
          fi

      - name: Configure Release
        run: |
          cmake --preset release \
            -DCMAKE_PREFIX_PATH="${{ github.workspace }}/.deps/install"

      - name: Build SwordFS
        run: cmake --build build --target swordfs

      - name: Build deterministic fstests shard
        run: |
          python3 scripts/conformance/fstests/plan.py \
            --shard "${{ matrix.shard }}" \
            > "${RUNNER_TEMP}/fstests-tests.txt"
          test -s "${RUNNER_TEMP}/fstests-tests.txt"

      - name: Run pinned fstests shard
        id: fstests-harness
        env:
          FSTESTS_SHARD: ${{ matrix.shard }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          mkdir -p build/fstests-conformance
          verify_args=()
          if [ "${{ github.event_name }}" = "pull_request" ] && [ "${FSTESTS_SHARD}" = "supported-0" ]; then
            if ! git diff --quiet "${PR_BASE_SHA}" HEAD -- \
              conformance/fstests/version.env conformance/fstests/selected.txt; then
              verify_args+=(--verify-selection)
            fi
          fi

          set +e
          sudo --preserve-env=GITHUB_RUN_ID,GITHUB_RUN_ATTEMPT,RUNNER_OS \
            SWORDFS_BIN="${{ github.workspace }}/build/swordfs" \
            bash scripts/conformance/fstests/run.sh \
              --tests-file "${RUNNER_TEMP}/fstests-tests.txt" \
              --shard-name "${FSTESTS_SHARD}" \
              --suite-timeout "${{ matrix.suite_timeout }}" \
              --output-dir "${{ github.workspace }}/build/fstests-conformance" \
              "${verify_args[@]}"
          status=$?
          set -e
          echo "${status}" | sudo tee build/fstests-conformance/harness-status.txt >/dev/null
          sudo chown -R "$(id -u):$(id -g)" build/fstests-conformance
          exit "${status}"

      - name: Upload fstests shard evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fstests-conformance-${{ matrix.shard }}
          path: build/fstests-conformance
          if-no-files-found: warn

  fstests-conformance:
    name: fstests-conformance (Release)
    needs: fstests-conformance-shard
    if: always() && (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.ref }}
          fetch-depth: 0
          submodules: false

      - name: Download fstests shard evidence
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: fstests-conformance-*
          path: build/fstests-shards
          merge-multiple: false

      - name: Aggregate fstests shard evidence
        env:
          FSTESTS_SHARD_MATRIX_RESULT: ${{ needs.fstests-conformance-shard.result }}
        run: |
          python3 scripts/conformance/fstests/aggregate.py \
            --shards-dir build/fstests-shards \
            --output-dir build/fstests-conformance \
            --matrix-result "${FSTESTS_SHARD_MATRIX_RESULT}"

      - name: Classify fstests results
        if: always()
        env:
          ALLOW_SUPPORTED_REMOVAL: ${{ github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'conformance-semantic-change') }}
          ALLOW_DEFERRED_ADDITION: ${{ github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'conformance-deferred-change') }}
        run: |
          source conformance/fstests/version.env
          baseline_args=()
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            previous_supported="${RUNNER_TEMP}/fstests-previous-supported.txt"
            if git show "${{ github.event.pull_request.base.sha }}:conformance/fstests/supported.txt" > "${previous_supported}" 2>/dev/null; then
              baseline_args+=(--previous-supported-file "${previous_supported}")
            fi
            previous_deferred="${RUNNER_TEMP}/fstests-previous-deferred.tsv"
            if git show "${{ github.event.pull_request.base.sha }}:conformance/fstests/deferred-ci.tsv" > "${previous_deferred}" 2>/dev/null; then
              baseline_args+=(--previous-deferred-file "${previous_deferred}")
            fi
            if [ "${ALLOW_SUPPORTED_REMOVAL}" = "true" ]; then
              baseline_args+=(--allow-supported-removal)
            fi
            if [ "${ALLOW_DEFERRED_ADDITION}" = "true" ]; then
              baseline_args+=(--allow-deferred-addition)
            fi
          fi

          python3 scripts/conformance/fstests/classify.py \
            --selected-file conformance/fstests/selected.txt \
            --result-xml build/fstests-conformance/raw/results/result.xml \
            --result-dir build/fstests-conformance/raw/results \
            --supported-file conformance/fstests/supported.txt \
            --known-gaps-file conformance/fstests/known-gaps.tsv \
            --deferred-file conformance/fstests/deferred-ci.tsv \
            --output-dir build/fstests-conformance \
            --swordfs-commit "$(git rev-parse HEAD)" \
            --fstests-commit "${FSTESTS_COMMIT}" \
            --fstests-group "${FSTESTS_GROUP}" \
            --environment-json build/fstests-conformance/environment.json \
            --harness-status-file build/fstests-conformance/harness-status.txt \
            "${baseline_args[@]}" \
            --strict

      - name: Publish fstests summary to job
        if: always()
        run: |
          if [ -f build/fstests-conformance/report.md ]; then
            cat build/fstests-conformance/report.md >> "${GITHUB_STEP_SUMMARY}"
          else
            echo '## fstests infrastructure failure' >> "${GITHUB_STEP_SUMMARY}"
            echo '' >> "${GITHUB_STEP_SUMMARY}"
            echo 'The aggregate job ended before a classified report was produced. Inspect the uploaded logs.' >> "${GITHUB_STEP_SUMMARY}"
          fi

      - name: Upload fstests evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fstests-conformance
          path: build/fstests-conformance
          if-no-files-found: warn

  publish-pjdfstest-status:
    name: publish-pjdfstest-status
    needs: pjdfstest-conformance
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          submodules: false

      - name: Download conformance evidence
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: pjdfstest-conformance
          path: build/pjdfstest-publish-input

      - name: Publish stable status branch
        env:
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          CONFORMANCE_JOB_RESULT: ${{ needs.pjdfstest-conformance.result }}
        run: |
          set -euo pipefail
          status_dir="${RUNNER_TEMP}/pjdfstest-status"
          rm -rf "${status_dir}"

          if git ls-remote --exit-code --heads origin pjdfstest-status >/dev/null 2>&1; then
            git fetch origin pjdfstest-status:refs/remotes/origin/pjdfstest-status
            git worktree add -B pjdfstest-status "${status_dir}" origin/pjdfstest-status
          else
            git worktree add --detach "${status_dir}" HEAD
            (
              cd "${status_dir}"
              git switch --orphan pjdfstest-status
              git rm -rf . >/dev/null 2>&1 || true
            )
          fi

          python3 scripts/conformance/pjdfstest/update-status.py \
            --result build/pjdfstest-publish-input/result.json \
            --report build/pjdfstest-publish-input/report.md \
            --history "${status_dir}/history.json" \
            --output-dir "${status_dir}" \
            --swordfs-commit "${GITHUB_SHA}" \
            --run-url "${RUN_URL}" \
            --infra-failure "pjdfstest-conformance job result: ${CONFORMANCE_JOB_RESULT}"

          git -C "${status_dir}" config user.name github-actions[bot]
          git -C "${status_dir}" config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git -C "${status_dir}" add status.md latest.json history.json
          git -C "${status_dir}" commit -m "status: update pjdfstest conformance for ${GITHUB_SHA}"
          git -C "${status_dir}" push origin HEAD:pjdfstest-status

  publish-fstests-status:
    name: publish-fstests-status
    needs: fstests-conformance
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          submodules: false

      - name: Download conformance evidence
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: fstests-conformance
          path: build/fstests-publish-input

      - name: Publish stable status branch
        env:
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          CONFORMANCE_JOB_RESULT: ${{ needs.fstests-conformance.result }}
        run: |
          set -euo pipefail
          status_dir="${RUNNER_TEMP}/fstests-status"
          rm -rf "${status_dir}"

          if git ls-remote --exit-code --heads origin fstests-status >/dev/null 2>&1; then
            git fetch origin fstests-status:refs/remotes/origin/fstests-status
            git worktree add -B fstests-status "${status_dir}" origin/fstests-status
          else
            git worktree add --detach "${status_dir}" HEAD
            (
              cd "${status_dir}"
              git switch --orphan fstests-status
              git rm -rf . >/dev/null 2>&1 || true
            )
          fi

          git -C "${status_dir}" config user.name github-actions[bot]
          git -C "${status_dir}" config user.email 41898282+github-actions[bot]@users.noreply.github.com

          publish_once() {
            python3 scripts/conformance/fstests/update-status.py \
              --result build/fstests-publish-input/result.json \
              --report build/fstests-publish-input/report.md \
              --history "${status_dir}/history.json" \
              --output-dir "${status_dir}" \
              --swordfs-commit "${GITHUB_SHA}" \
              --run-url "${RUN_URL}" \
              --run-id "${GITHUB_RUN_ID}" \
              --infra-failure "fstests-conformance job result: ${CONFORMANCE_JOB_RESULT}" || return $?

            git -C "${status_dir}" add status.md latest.json history.json || return $?
            if git -C "${status_dir}" diff --cached --quiet; then
              echo "No fstests status update required; a newer run is already published."
              return 10
            fi
            git -C "${status_dir}" commit -m "status: update fstests conformance for ${GITHUB_SHA}" || return $?
          }

          for attempt in 1 2 3; do
            if publish_once; then
              if git -C "${status_dir}" push origin HEAD:fstests-status; then
                exit 0
              fi
            else
              publish_status=$?
              if [ "${publish_status}" -eq 10 ]; then
                exit 0
              fi
              exit "${publish_status}"
            fi

            if [ "${attempt}" -eq 3 ]; then
              echo "Failed to publish fstests status after ${attempt} attempts" >&2
              exit 1
            fi

            git fetch origin +refs/heads/fstests-status:refs/remotes/origin/fstests-status
            git -C "${status_dir}" reset --hard origin/fstests-status
          done
