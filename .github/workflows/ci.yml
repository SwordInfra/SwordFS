name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  clang-format:
    name: clang-format
    if: github.event_name == 'pull_request' || github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.ref }}
          fetch-depth: 2

      - name: Install pre-commit
        run: pipx install pre-commit

      - name: Check formatting
        run: pre-commit run --all-files

  build-and-test:
    name: build-and-test (${{ matrix.build_type }})
    needs: clang-format
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        build_type: [Debug, Release]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.ref }}
          fetch-depth: 0
          submodules: false

      - name: Restore native dependency cache
        uses: actions/cache@v4
        with:
          path: .deps/install
          key: swordfs-native-deps-v4-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/native-deps-cache.env') }}

      - name: Install dependencies
        run: sudo DEPS_PREFIX="${{ github.workspace }}/.deps/install" bash scripts/install-deps.sh

      - name: Global test setup
        run: |
          sudo mkdir -p /etc/swordfs
          sudo chown "$(id -u):$(id -g)" /etc/swordfs
          sudo modprobe fuse
          sudo chmod 666 /dev/fuse
          getent group fuse || sudo groupadd fuse
          sudo usermod -aG fuse "$(whoami)"

      - name: Install Debug CI tools
        if: matrix.build_type == 'Debug'
        run: sudo apt-get install -y -qq lcov clang-tidy

      - name: Configure
        run: |
          sudo rm -rf build
          if [ "${{ matrix.build_type }}" = "Debug" ]; then
            cmake --preset default \
              -DCMAKE_PREFIX_PATH="${{ github.workspace }}/.deps/install" \
              -DCMAKE_CXX_FLAGS="--coverage" \
              -DCMAKE_EXE_LINKER_FLAGS="--coverage"
          else
            cmake --preset release \
              -DCMAKE_PREFIX_PATH="${{ github.workspace }}/.deps/install"
          fi

      - name: Build
        run: cmake --build build --target swordfs swordfs_test swordfs_e2e_test

      - name: Run clang-tidy (changed files only)
        if: matrix.build_type == 'Debug'
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          else
            BASE=$(git rev-parse HEAD^ 2>/dev/null || git rev-list --max-parents=0 HEAD)
          fi
          echo "clang-tidy base: $BASE"
          CHANGED=$(git diff --name-only --diff-filter=ACMR "$BASE"...HEAD \
            | grep -E '\.(cpp|hpp)$' | grep '^src/' || true)
          if [ -n "$CHANGED" ]; then
            printf '%s\n' "$CHANGED"
            echo "$CHANGED" | xargs run-clang-tidy -p build -j $(nproc) \
              -warnings-as-errors='*'
          else
            echo "No C++ source changes detected."
          fi

      - name: Test (unit)
        run: |
          bash scripts/run-ut.sh --gtest_color=no --gtest_output=xml:unit-test-results.xml
          if grep -q '<skipped' unit-test-results.xml; then
            echo "ERROR: unit test suite contains skipped tests."
            grep '<skipped' unit-test-results.xml
            exit 1
          fi

      - name: Test (E2E)
        run: |
          sg fuse -c "bash scripts/run-e2e.sh --gtest_color=no"

      - name: Generate coverage report
        if: matrix.build_type == 'Debug'
        run: |
          # Run the entire coverage pipeline with relaxed error handling.
          # lcov 2.x (Ubuntu 24.04) is stricter than 1.x and may exit non-zero
          # for gcov version mismatches, empty .gcda files, or missing source
          # references — all of which are harmless for our report.
          set +e

          # Step 1: capture raw coverage data
          lcov --capture --directory build --output-file coverage.info \
               --ignore-errors inconsistent,gcov,source,mismatch,negative,empty,unused,corrupt
          LCOV_EXIT=$?
          if [ $LCOV_EXIT -ne 0 ]; then
            echo "::warning::lcov --capture exited with $LCOV_EXIT (ignored)"
          fi

          # Step 2: remove system / third-party paths
          if [ -f coverage.info ] && [ -s coverage.info ]; then
            lcov --remove coverage.info \
                 '/usr/*' '*/_deps/*' '*/googletest-src/*' '*/build/*' \
                 --output-file coverage_filtered.info \
                 --ignore-errors unused,empty,source,mismatch,corrupt,inconsistent || true
            if [ -f coverage_filtered.info ] && [ -s coverage_filtered.info ]; then
              mv coverage_filtered.info coverage.info
            else
              echo "::warning::coverage_filtered.info empty — keeping original coverage.info"
            fi
          else
            echo "::warning::coverage.info is empty or missing after capture"
          fi

          # Step 3: print summary
          if [ -f coverage.info ] && [ -s coverage.info ]; then
            lcov --list coverage.info --ignore-errors unused,empty,source || true
          fi

      - name: Upload coverage to Codecov
        if: matrix.build_type == 'Debug'
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.info
          fail_ci_if_error: false
