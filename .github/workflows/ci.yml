name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - name: Restore/Save build cache
        id: cache
        uses: actions/cache@v4
        with:
          path: |
            /usr/local/include/folly
            /usr/local/include/aws
            /usr/local/lib/cmake/folly
            /usr/local/lib/cmake/AWSSDK
            /usr/local/lib/cmake/aws-cpp-sdk-*
            /usr/local/lib/cmake/aws-crt-cpp
            /usr/local/lib/cmake/aws-c-*
            /usr/local/lib/libfolly*
            /usr/local/lib/libaws*
            /usr/local/lib/libgtest*
            /usr/local/lib/libgmock*
          key: deps-${{ runner.os }}-${{ hashFiles('scripts/install-deps.sh') }}
          restore-keys: |
            deps-${{ runner.os }}-

      - name: Verify cached dependencies
        id: verify
        if: steps.cache.outputs.cache-hit == 'true'
        run: |
          echo "==> Verifying cached folly..."
          TMPDIR=$(mktemp -d)
          cat > "$TMPDIR/CMakeLists.txt" << 'CMEOF'
          cmake_minimum_required(VERSION 3.16)
          project(VerifyFolly CXX)
          find_package(folly REQUIRED)
          message(STATUS "folly OK")
          CMEOF
          if cmake -S "$TMPDIR" -B "$TMPDIR/build" > /dev/null 2>&1; then
            echo "  [ok] folly verified"
          else
            echo "  [FAIL] folly verification failed, will reinstall"
            echo "needs_reinstall=true" >> "$GITHUB_OUTPUT"
          fi
          rm -rf "$TMPDIR"

          echo "==> Verifying cached AWS SDK..."
          TMPDIR=$(mktemp -d)
          cat > "$TMPDIR/CMakeLists.txt" << 'CMEOF'
          cmake_minimum_required(VERSION 3.16)
          project(VerifyAwsSdk CXX)
          find_package(AWSSDK REQUIRED COMPONENTS s3)
          message(STATUS "AWSSDK OK")
          CMEOF
          if cmake -S "$TMPDIR" -B "$TMPDIR/build" > /dev/null 2>&1; then
            echo "  [ok] AWS SDK verified"
          else
            echo "  [FAIL] AWS SDK verification failed, will reinstall"
            echo "needs_reinstall=true" >> "$GITHUB_OUTPUT"
          fi
          rm -rf "$TMPDIR"

      - name: Clear broken cached dependencies
        if: steps.verify.outputs.needs_reinstall == 'true'
        run: |
          echo "==> Removing broken cached dependencies..."
          sudo rm -rf /usr/local/include/folly
          sudo rm -rf /usr/local/include/aws
          sudo rm -rf /usr/local/lib/cmake/folly
          sudo rm -rf /usr/local/lib/cmake/AWSSDK
          sudo rm -rf /usr/local/lib/cmake/aws-cpp-sdk-*
          sudo rm -rf /usr/local/lib/cmake/aws-crt-cpp
          sudo rm -rf /usr/local/lib/cmake/aws-c-*
          sudo rm -f /usr/local/lib/libfolly*
          sudo rm -f /usr/local/lib/libaws*
          sudo rm -f /usr/local/lib/libgtest*
          sudo rm -f /usr/local/lib/libgmock*

      - name: Install dependencies
        run: |
          if [ "${{ steps.cache.outputs.cache-hit }}" = "true" ] && \
             [ "${{ steps.verify.outputs.needs_reinstall }}" != "true" ]; then
            echo "==> Cache hit, skipping heavy deps"
            sudo bash scripts/install-deps.sh --skip-heavy
          else
            echo "==> Cache miss or stale, full install"
            sudo bash scripts/install-deps.sh
          fi

      - name: Install CI tools
        run: sudo apt-get install -y -qq lcov clang-tidy

      - name: Configure
        run: |
          sudo rm -rf build
          cmake --preset default -DCMAKE_CXX_FLAGS="--coverage" -DCMAKE_EXE_LINKER_FLAGS="--coverage"

      - name: Build
        run: cmake --build build --target swordfs swordfs_test

      - name: Run clang-tidy (changed files only)
        run: |
          if git rev-parse origin/main >/dev/null 2>&1; then
            BASE="origin/main"
          else
            BASE=$(git rev-list --max-parents=0 HEAD)
          fi
          CHANGED=$(git diff --name-only --diff-filter=ACMR "$BASE"...HEAD \
            | grep -E '\.(cpp|hpp)$' | grep '^src/' || true)
          if [ -n "$CHANGED" ]; then
            echo "$CHANGED" | xargs run-clang-tidy -p build -j $(nproc) \
              --warnings-as-errors='*' || true
          else
            echo "No C++ source changes detected."
          fi

      - name: Test
        run: build/swordfs_test --gtest_color=no

      - name: Generate coverage report
        run: |
          lcov --capture --directory build --output-file coverage.info \
               --ignore-errors inconsistent,gcov,source,mismatch,negative
          lcov --remove coverage.info '/usr/*' '*/_deps/*' \
               --output-file coverage.info \
               --ignore-errors unused
          lcov --list coverage.info || true

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.info
          fail_ci_if_error: false
