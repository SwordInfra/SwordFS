name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - name: Restore build cache
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: |
            /usr/local/lib/libfolly*
            /usr/local/include/folly/
            /usr/local/lib/cmake/folly/
            /usr/local/lib/libaws*
            /usr/local/include/aws/
            /usr/local/lib/cmake/aws-*/
          key: deps-${{ runner.os }}-${{ hashFiles('scripts/install-deps.sh') }}

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y -qq lcov
          if [ ! -f /usr/local/lib/cmake/folly/folly-config.cmake ]; then
            sudo bash scripts/install-deps.sh
          fi
          sudo rm -rf build

      - name: Save build cache
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            /usr/local/lib/libfolly*
            /usr/local/include/folly/
            /usr/local/lib/cmake/folly/
            /usr/local/lib/libaws*
            /usr/local/include/aws/
            /usr/local/lib/cmake/aws-*/
          key: ${{ steps.cache.outputs.cache-primary-key }}

      - name: Configure
        run: cmake --preset default -DCMAKE_CXX_FLAGS="--coverage" -DCMAKE_EXE_LINKER_FLAGS="--coverage"

      - name: Build
        run: cmake --build build --target swordfs swordfs_test

      - name: Test
        run: build/swordfs_test --gtest_color=no

      - name: Generate coverage report
        run: |
          lcov --capture --directory build --output-file coverage.info \
               --ignore-errors inconsistent,gcov,source,mismatch,negative
          lcov --remove coverage.info '/usr/*' '*/_deps/*' \
               --output-file coverage.info \
               --ignore-errors unused
          lcov --list coverage.info || true

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.info
          fail_ci_if_error: false

  clang-format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run clang-format
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq clang-format
          find src tests -name '*.cpp' -o -name '*.hpp' -o -name '*.h' \
            | xargs clang-format --dry-run -Werror --style=file || {
              echo "::warning::Some files need formatting. Run clang-format -i on changed files."
              echo "This check will become mandatory once codebase is reformatted."
            }

  clang-tidy:
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - name: Cache folly build
        uses: actions/cache@v4
        with:
          path: /usr/local
          key: folly-${{ runner.os }}-${{ hashFiles('scripts/install-deps.sh') }}
      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          if [ ! -f /usr/local/lib/libfolly.a ]; then
            sudo bash scripts/install-deps.sh
          fi
          sudo apt-get install -y -qq clang-tidy
          sudo rm -rf build
      - name: Configure
        run: cmake --preset default
      - name: Run clang-tidy
        run: |
          find src -name '*.cpp' -o -name '*.hpp' \
            | xargs clang-tidy -p build \
                --checks='-*,bugprone-*,performance-*,modernize-use-override' \
                --warnings-as-errors='*' \
            || true
