name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  clang-format:
    name: clang-format
    if: github.event_name == 'pull_request' || github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.ref }}
          fetch-depth: 2

      - name: Install clang-format
        run: sudo apt-get update && sudo apt-get install -y clang-format

      - name: Format C++ sources
        run: |
          find src tests -type f \( -name '*.cpp' -o -name '*.hpp' -o -name '*.h' -o -name '*.cc' -o -name '*.cxx' \) -print0 \
            | xargs -0 clang-format -i
          git diff --exit-code -- src tests

  build-and-test:
    needs: clang-format
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.ref }}
          submodules: false

      - name: Restore native dependency cache
        uses: actions/cache@v4
        with:
          path: .deps/install
          key: swordfs-native-deps-v4-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/native-deps-cache.env') }}

      - name: Install dependencies
        run: sudo DEPS_PREFIX="${{ github.workspace }}/.deps/install" bash scripts/install-deps.sh

      - name: Install CI tools
        run: sudo apt-get install -y -qq lcov clang-tidy

      - name: Configure
        run: |
          sudo rm -rf build
          cmake --preset default -DCMAKE_PREFIX_PATH="${{ github.workspace }}/.deps/install" -DCMAKE_CXX_FLAGS="--coverage" -DCMAKE_EXE_LINKER_FLAGS="--coverage"

      - name: Build
        run: cmake --build build --target swordfs swordfs_test swordfs_e2e_test

      - name: Run clang-tidy (changed files only)
        run: |
          if git rev-parse origin/main >/dev/null 2>&1; then
            BASE="origin/main"
          else
            BASE=$(git rev-list --max-parents=0 HEAD)
          fi
          CHANGED=$(git diff --name-only --diff-filter=ACMR "$BASE"...HEAD \
            | grep -E '\.(cpp|hpp)$' | grep '^src/' || true)
          if [ -n "$CHANGED" ]; then
            echo "$CHANGED" | xargs run-clang-tidy -p build -j $(nproc) \
              --warnings-as-errors='*' || true
          else
            echo "No C++ source changes detected."
          fi

      - name: Start Redis for coverage
        run: |
          docker run -d --name swordfs-coverage-redis -p 6379:6379 redis:7-alpine
          until docker exec swordfs-coverage-redis redis-cli ping | grep -q PONG; do sleep 1; done

      - name: Prepare unit test volume config directory
        run: |
          sudo mkdir -p /etc/swordfs
          sudo chown "$(whoami):$(id -gn)" /etc/swordfs

      - name: Test (unit)
        env:
          SWORDFS_REDIS_TEST_URL: redis://127.0.0.1:6379
        run: build/swordfs_test --gtest_color=no

      - name: Stop Redis for coverage tests
        run: docker rm -f swordfs-coverage-redis

      - name: Test (E2E)
        env:
          SWORDFS_BIN: "${{ github.workspace }}/build/swordfs"
          E2E_BIN: "${{ github.workspace }}/build/swordfs_e2e_test"
        run: |
          getent group fuse || sudo groupadd fuse
          sudo usermod -aG fuse "$(whoami)"
          sg fuse -c "bash scripts/run-e2e.sh --gtest_color=no"

      - name: Generate coverage report
        run: |
          set +e
          lcov --capture --directory build --output-file coverage.info \
               --ignore-errors inconsistent,gcov,source,mismatch,negative,empty,unused,corrupt
          LCOV_EXIT=$?
          if [ $LCOV_EXIT -ne 0 ]; then
            echo "::warning::lcov --capture exited with $LCOV_EXIT (ignored)"
          fi
          if [ -f coverage.info ] && [ -s coverage.info ]; then
            lcov --remove coverage.info \
                 '/usr/*' '*/_deps/*' '*/googletest-src/*' '*/build/*' \
                 --output-file coverage_filtered.info \
                 --ignore-errors unused,empty,source,mismatch,corrupt,inconsistent || true
            if [ -f coverage_filtered.info ] && [ -s coverage_filtered.info ]; then
              mv coverage_filtered.info coverage.info
            else
              echo "::warning::coverage_filtered.info empty — keeping original coverage.info"
            fi
          else
            echo "::warning::coverage.info is empty or missing after capture"
          fi
          if [ -f coverage.info ] && [ -s coverage.info ]; then
            lcov --list coverage.info --ignore-errors unused,empty,source || true
          fi

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.info
          fail_ci_if_error: false

  redis-integration:
    name: Redis integration
    needs: clang-format
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - name: Restore native dependency cache
        uses: actions/cache@v4
        with:
          path: .deps/install
          key: swordfs-native-deps-v4-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/native-deps-cache.env') }}

      - name: Install dependencies
        run: sudo DEPS_PREFIX="${{ github.workspace }}/.deps/install" bash scripts/install-deps.sh

      - name: Configure
        run: |
          sudo rm -rf build
          cmake --preset default -DCMAKE_PREFIX_PATH="${{ github.workspace }}/.deps/install"

      - name: Build Redis tests
        run: cmake --build build --target swordfs_test

      - name: Test Redis Standalone integration
        env:
          SWORDFS_REDIS_TEST_URL: redis://127.0.0.1:6379/15
        run: build/swordfs_test --gtest_filter='RedisMeta*' --gtest_color=no
